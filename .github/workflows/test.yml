name: Pipeline tests

# Python unit tests for the ingest/build code (tests/), on every human push
# or PR that touches it. The widget's copy-gate tests run in deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "build/**"
      - "tests/**"
      - "schema.sql"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
