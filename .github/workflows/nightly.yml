name: Nightly map pull

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 4:30/5:30 AM Central (GitHub often starts it hours late)
    # Second daily pass, a hedge against DNR itself being down at run
    # time. If the morning pull succeeded, this one finds no changes and
    # the quiet-repo rule makes it a no-op.
    - cron: "0 17 * * *"    # 17:00 UTC = 11 AM/noon Central
  workflow_dispatch:

permissions:
  contents: write

# Never let two data-pipeline runs mutate the DB and push concurrently.
# GitHub keeps at most ONE pending run per group and cancels the older
# pending run when a newer one queues — so don't stack manual dispatches
# while a run is in flight, and keep timeouts tight so a hung run can't
# hold the group hostage.
concurrency:
  group: data-pipeline

# Up to five attempts, each on a FRESH runner: the state network drops
# some GitHub runner addresses outright, so only a new machine helps (see
# dnr-attempt.yml). A blocked attempt ends green with reached=false and
# the next one takes over; the attempt that gets through does the whole
# pull, and anything that breaks from there fails the run loudly.
jobs:
  attempt-1:
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: nightly, attempt: 1 }
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: nightly, attempt: 2 }
  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: nightly, attempt: 3 }
  attempt-4:
    needs: attempt-3
    if: needs.attempt-3.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: nightly, attempt: 4 }
  attempt-5:
    needs: attempt-4
    if: needs.attempt-4.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: nightly, attempt: 5 }

  # Five blocked runners in a row (under 1% odds at the measured block
  # rate), or DNR is genuinely down. Nothing was pulled either way, so the
  # failure email should fire.
  unreachable:
    needs: attempt-5
    if: needs.attempt-5.outputs.reached == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=DNR unreachable::Five fresh runners in a row could not connect to dnrmaps.wi.gov. Nothing was pulled; the next scheduled run will try again. If this repeats, check whether DNR is down or now blocks GitHub outright."
          exit 1

  # Bot pushes don't fire push-triggered workflows, so redeploy explicitly —
  # but only when an attempt actually committed data (quiet-repo rule).
  deploy:
    needs: [attempt-1, attempt-2, attempt-3, attempt-4, attempt-5]
    if: ${{ !cancelled() && contains(needs.*.outputs.pushed, 'true') }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
