name: Quarterly bulk ingest

on:
  schedule:
    # DNR's extracts are dated at calendar-quarter starts (observed:
    # 2026-07-01), so fetch on the 5th of Jan/Apr/Jul/Oct — the old
    # Mar/Jun/Sep/Dec schedule would have left each new extract sitting
    # unfetched for two months.
    - cron: "0 12 5 1,4,7,10 *"   # 5th of Jan/Apr/Jul/Oct; bulk publishes ~the 1st
  workflow_dispatch:

permissions:
  contents: write

# Shares the nightly workflow's group: bulk ingest and map pull must not
# mutate the DB and push at the same time. One pending run per group —
# a newer queued run cancels an older queued one, so if this quarterly
# run ever shows as canceled, re-dispatch it manually.
concurrency:
  group: data-pipeline

# Same fresh-runner attempts as nightly.yml: the bulk zip lives on
# apps.dnr.wi.gov, behind the same state network that turns away some
# GitHub runner addresses (see dnr-attempt.yml).
jobs:
  attempt-1:
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: quarterly, attempt: 1 }
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: quarterly, attempt: 2 }
  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: quarterly, attempt: 3 }
  attempt-4:
    needs: attempt-3
    if: needs.attempt-3.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: quarterly, attempt: 4 }
  attempt-5:
    needs: attempt-4
    if: needs.attempt-4.outputs.reached == 'false'
    uses: ./.github/workflows/dnr-attempt.yml
    with: { pipeline: quarterly, attempt: 5 }

  unreachable:
    needs: attempt-5
    if: needs.attempt-5.outputs.reached == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=DNR unreachable::Five fresh runners in a row could not connect to apps.dnr.wi.gov. Nothing was ingested; re-dispatch this workflow (Actions > Quarterly bulk ingest > Run workflow) once DNR is reachable."
          exit 1

  deploy:
    needs: [attempt-1, attempt-2, attempt-3, attempt-4, attempt-5]
    if: ${{ !cancelled() && contains(needs.*.outputs.pushed, 'true') }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
