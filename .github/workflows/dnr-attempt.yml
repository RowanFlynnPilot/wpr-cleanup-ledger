name: DNR pipeline attempt

# One attempt at a DNR data pipeline, on whatever fresh runner GitHub
# hands out. nightly.yml and quarterly.yml call this up to five times in
# a row.
#
# Why a retry has to change machines instead of waiting in place: the
# State of Wisconsin's network silently drops TCP connections from a
# subset of GitHub's runner IP addresses. A September 2026 probe put 16
# runners on DNR at the same moment: 10 connected in under half a
# second, 6 could not open a connection to ANY state host (dnrmaps.wi.gov,
# dnr.wi.gov, apps.dnr.wi.gov) however often they tried. That matches the
# ~30% of nightly runs from August on that died on their very first
# request, each after ingest/dnr.py's in-place retries had spent 3.5
# minutes on a runner that was never going to get through. A new job
# gets a new VM and, with it, a new address.
#
# So the first step asks whether THIS runner can reach the state host the
# pipeline needs. If not, the attempt ends green with reached=false and
# the caller hands off to a fresh runner. Anything that goes wrong after
# the preflight passes is a real failure and fails the run loudly.
#
# No concurrency block here: the caller's data-pipeline group already
# covers this run, and repeating it in a called workflow deadlocks.
on:
  workflow_call:
    inputs:
      pipeline:
        description: '"nightly" (map layers + PFAS) or "quarterly" (bulk zip)'
        type: string
        required: true
      attempt:
        description: Attempt number, for the logs
        type: number
        required: true
    outputs:
      reached:
        description: '"true" if this runner could reach the state network'
        value: ${{ jobs.run.outputs.reached }}
      pushed:
        description: '"true" if this attempt committed and pushed data'
        value: ${{ jobs.run.outputs.pushed }}

jobs:
  run:
    name: ${{ inputs.pipeline }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.pipeline == 'quarterly' && 30 || 15 }}
    outputs:
      reached: ${{ steps.preflight.outputs.reached }}
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      # Any HTTP response at all proves the TCP + TLS path is open; a
      # blocked runner never gets that far (connect times out every try).
      - name: Can this runner reach the state network?
        id: preflight
        env:
          HOST: ${{ inputs.pipeline == 'quarterly' && 'apps.dnr.wi.gov' || 'dnrmaps.wi.gov' }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          for try in 1 2; do
            if curl -s -o /dev/null --connect-timeout 10 --max-time 30 "https://$HOST/"; then
              echo "reached=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Runner blocked by the state network::Attempt $ATTEMPT could not connect to $HOST (the State of Wisconsin network drops some GitHub runner addresses). Handing off to a fresh runner."
          echo "reached=false" >> "$GITHUB_OUTPUT"

      - if: steps.preflight.outputs.reached == 'true'
        uses: actions/checkout@v4
      - if: steps.preflight.outputs.reached == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.preflight.outputs.reached == 'true'
        run: python -m pip install -r requirements.txt

      - if: steps.preflight.outputs.reached == 'true' && inputs.pipeline == 'nightly'
        run: python ingest/pull_arcgis.py
      - if: steps.preflight.outputs.reached == 'true' && inputs.pipeline == 'nightly'
        run: python ingest/pull_pfas.py
      - if: steps.preflight.outputs.reached == 'true' && inputs.pipeline == 'quarterly'
        run: python ingest/ingest_bulk.py
      - if: steps.preflight.outputs.reached == 'true'
        run: python build/build_json.py
      - name: Monthly heartbeat
        if: steps.preflight.outputs.reached == 'true' && inputs.pipeline == 'nightly'
        run: date -u +%Y-%m > data/heartbeat.txt

      - name: Commit if changed
        id: commit
        if: steps.preflight.outputs.reached == 'true'
        env:
          MESSAGE: ${{ inputs.pipeline == 'quarterly' && 'Quarterly bulk ingest' || 'Nightly map pull' }}
        run: |
          git config user.name "cleanup-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$MESSAGE"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
